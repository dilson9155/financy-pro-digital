# =============================================================================
# Nginx - proxy reverso para o Financy Pro Digital (VPS Hostinger)
# Copie este arquivo para /etc/nginx/sites-available/financy-pro-digital e
# ajuste server_name. Depois:
#   sudo ln -s /etc/nginx/sites-available/financy-pro-digital /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream financy_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name app.financy.example.com;   # << ajuste para o dominio real

    # force HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.financy.example.com;   # << ajuste para o dominio real

    # --- Certificados SSL (Let's Encrypt / certbot) ---------------------------
    ssl_certificate     /etc/letsencrypt/live/app.financy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.financy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- Uploads do app (conciliacao de extratos) ------------------------------
    client_max_body_size 10m;

    # limitadores basicos
    limit_req_zone $binary_remote_addr zone=financy:10m rate=10r/s;

    location / {
        limit_req zone=financy burst=20 nodelay;
        proxy_pass http://financy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # cache estatico de longa duracao (hashes de build do Next.js)
    location /_next/static/ {
        proxy_pass http://financy_backend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}