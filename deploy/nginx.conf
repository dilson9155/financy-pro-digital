# =============================================================================
# Nginx - proxy reverso para o Financy Pro Digital (VPS Hostinger)
#
# Passo a passo:
#   1) Copie para /etc/nginx/sites-available/financy-pro-digital
#   2) Ajuste "server_name" para o seu dominio (as duas ocorrencias nao existem:
#      aqui e so uma, no bloco abaixo)
#   3) Ative:  sudo ln -s /etc/nginx/sites-available/financy-pro-digital \
#                          /etc/nginx/sites-enabled/
#   4) Teste:  sudo nginx -t && sudo systemctl reload nginx
#   5) Emita o HTTPS: sudo certbot --nginx -d SEU_DOMINIO
#      (o certbot adiciona sozinho o bloco 443 + o redirecionamento HTTPS)
#
# Este arquivo comeca apenas com HTTP de proposito: e o que permite o certbot
# validar o dominio a primeira vez. Depois ele cuida do TLS.
# =============================================================================

# Zona de rate limit. Fica no contexto "http" (arquivos em sites-enabled sao
# incluidos dentro de http {} pelo nginx.conf do Ubuntu), e NAO dentro do
# bloco server {} - colocar ali causa erro de sintaxe no `nginx -t`.
limit_req_zone $binary_remote_addr zone=financy:10m rate=10r/s;

upstream financy_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.financy.example.com;   # << ajuste para o dominio real

    # Uploads do app (conciliacao de extratos)
    client_max_body_size 10m;

    # Deixe o certbot validar por HTTP antes de existir HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        limit_req zone=financy burst=20 nodelay;
        proxy_pass http://financy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache estatico de longa duracao (assets com hash do Next.js)
    location /_next/static/ {
        proxy_pass http://financy_backend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
