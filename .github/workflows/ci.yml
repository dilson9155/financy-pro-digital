name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitarios
        run: npm test

  build:
    name: Build de producao
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    env:
      # Variaveis minimas para o build (pages sao forca-dinamicas e nao
      # consultam o banco durante a geracao de bundles).
      DATABASE_URL: postgresql://build:build@localhost:5432/build?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build